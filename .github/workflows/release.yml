name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK with version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "ip-camera-video-server-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ip-camera-video-server-*.apk
          generate_release_notes: true
          body: |
            ## Install on your phone

            1. Download `ip-camera-video-server-${{ github.ref_name }}.apk`
            2. Enable **Unknown sources** on your phone:
               Settings → Security → Install unknown apps → (your browser or Files app) → Allow
            3. Open the APK file on the phone to install it, OR install via ADB:
               ```bash
               adb install ip-camera-video-server-${{ github.ref_name }}.apk
               ```

            ## First run

            Open the app → tap **Start** → open `http://<phone-ip>:8080` in your browser.
            Default login: `admin` / `admin`

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full setup instructions.
